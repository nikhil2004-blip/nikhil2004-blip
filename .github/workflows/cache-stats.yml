name: Cache GitHub Stats Images

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cache-stats.yml"
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download stat images
        run: |
          mkdir -p assets
          rm -f assets/stats.png assets/langs.png assets/time.png assets/streak.png assets/trophy.png
          curl -L -f -o assets/stats.svg "https://github-profile-summary-cards.vercel.app/api/cards/stats?username=nikhil2004-blip&theme=github_dark"
          curl -L -f -o assets/langs.svg "https://github-profile-summary-cards.vercel.app/api/cards/repos-per-language?username=nikhil2004-blip&theme=github_dark"
          curl -L -f -o assets/time.svg "https://github-profile-summary-cards.vercel.app/api/cards/productive-time?username=nikhil2004-blip&theme=github_dark&utcOffset=5.5"
          curl -L -f -o assets/streak.svg "https://streak-stats.demolab.com?user=nikhil2004-blip&theme=github-dark&hide_border=true&ring=58A6FF&fire=58A6FF&currStreakLabel=58A6FF"
          curl -L -f -o assets/trophy.svg "https://github-profile-trophy.vercel.app/?username=nikhil2004-blip&theme=onestar&no-frame=true&no-bg=true&row=1&column=7"

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add assets/
          if ! git diff --cached --quiet; then
            git commit -m "chore: cache stat images"
            git push origin HEAD:main
          fi
