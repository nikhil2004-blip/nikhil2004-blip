name: Cache GitHub Stats Images

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cache-stats.yml"
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download stat images
        run: |
          set -e

          download_svg() {
            url="$1"
            output="$2"
            tmp_output="${output}.tmp"
            if curl -L -f -sS -o "$tmp_output" "$url"; then
              if grep -qi "temporarily rate limited\|ERROR" "$tmp_output"; then
                echo "Warning: Rate limited or error detected from $url. Keeping old file."
                rm -f "$tmp_output"
              else
                mv "$tmp_output" "$output"
              fi
            else
              echo "Warning: Failed to download from $url. Keeping old file."
              rm -f "$tmp_output"
            fi
          }

          mkdir -p assets
          rm -f assets/stats.png assets/langs.png assets/time.png assets/streak.png assets/trophy.png
          download_svg "https://github-profile-summary-cards.vercel.app/api/cards/stats?username=nikhil2004-blip&theme=github_dark" assets/stats.svg
          download_svg "https://github-profile-summary-cards.vercel.app/api/cards/repos-per-language?username=nikhil2004-blip&theme=github_dark" assets/langs.svg
          download_svg "https://github-profile-summary-cards.vercel.app/api/cards/productive-time?username=nikhil2004-blip&theme=github_dark&utcOffset=5.5" assets/time.svg
          download_svg "https://streak-stats.demolab.com?user=nikhil2004-blip&theme=github-dark&hide_border=true&ring=58A6FF&fire=58A6FF&currStreakLabel=58A6FF" assets/streak.svg || download_svg "https://streak-stats.vercel.app?user=nikhil2004-blip&theme=github-dark&hide_border=true&ring=58A6FF&fire=58A6FF&currStreakLabel=58A6FF" assets/streak.svg
          download_svg "https://github-profile-trophy.vercel.app/?username=nikhil2004-blip&theme=onestar&no-frame=true&no-bg=true&row=1&column=7" assets/trophy.svg || download_svg "https://github-profile-trophy-fork-two.vercel.app/?username=nikhil2004-blip&theme=onestar&no-frame=true&no-bg=true&row=1&column=7" assets/trophy.svg

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add assets/
          if ! git diff --cached --quiet; then
            git commit -m "chore: cache stat images"
            git push origin HEAD:main
          fi
